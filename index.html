<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Valentine’s Day ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  font-family: 'Segoe UI', sans-serif;
}
.card{
  background:white;
  padding:25px;
  border-radius:20px;
  text-align:center;
  width:340px;
  box-shadow:0 20px 40px rgba(0,0,0,.2);
}
.heart{
  font-size:48px;
  animation:pulse 1.2s infinite;
}
@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.15)}
  100%{transform:scale(1)}
}
button{
  margin-top:15px;
  padding:10px 18px;
  border:none;
  border-radius:20px;
  background:#ff5a79;
  color:white;
  font-size:14px;
  cursor:pointer;
}
.hidden{display:none;margin-top:12px;font-weight:600;}
iframe{
  margin-top:12px;
  border-radius:12px;
}
</style>
</head>

<body>
<div class="card">
  <div class="heart">❤️</div>
  <h2>Happy Valentine’s Day</h2>
  <p><b>For Samriddha (Darlo)</b></p>

  <p>
    Every day with you feels warmer, safer, and happier.  
    You’re my comfort, my smile, my forever.
  </p>

  <button onclick="reveal()">Tap for a surprise 💌</button>

  <div id="secret" class="hidden">
    You are my BIG dinosaur cat🦖❤😘<br>
    Love always,<br>
    Cookie 🍪
  </div>

  <!-- Music -->
  <iframe
  width="100%"
  height="180"
  src="https://www.youtube.com/embed/uC1iJcYOyeY?autoplay=1&mute=1"
  allow="autoplay; encrypted-media"
  allowfullscreen>
  </iframe>

  <small>🔊 Unmute for music</small>
</div>

<script>
function reveal(){
  document.getElementById("secret").classList.toggle("hidden");
}
</script>
</body>
</html>
